line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI uses `Depends(...)` in defaults intentionally.
    "UP038",  # isinstance((X, Y)) is fine and marginally faster; rule is deprecated.
]

[lint.per-file-ignores]
"alembic/*" = ["E501"]
"tests/*" = ["E501"]
